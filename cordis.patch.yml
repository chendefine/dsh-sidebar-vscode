# dsh-sidebar-vscode bundle layer (npm: dsh-sidebar-vscode;
# source: github.com/chendefine/dsh-sidebar-vscode).
#
# Inserts this plugin's host row. The node half owns the vscode-selection
# context boundary (agent/pre-step expansion of canonical `dsh-vscode:`
# and `dsh-vscode-res:` mentions into <text-selection> / <file-selection> /
# <folder-selection> context messages, sourced { kind: 'vscode-mention' } /
# { kind: 'vscode-resource' }); the browser half registers the
# 'dsh-sidebar-vscode:vscode' better-sidebar tab, the composer reference
# chips, and the reference rail.
#
# No config keys are read by the host half (capture bounds live in the
# sidebar settings page and ride inside each mention payload). User-facing
# configuration (the editor base URL and the workspace path mapping)
# lives in the sidebar settings page: 侧边卡片 → VSCode 卡片 → 功能设置
# (persisted in pluginSettings['dsh-sidebar-vscode:vscode'], NOT here).
#
# Double-mount guard (same pattern as dsh-better-sidebar's own bundle patch):
# an aggregate bundle may already mount this package under its own entry id.
# The `!!js` expression backs THIS row off when another enabled entry already
# mounts 'dsh-sidebar-vscode'; the loader evaluates it while processing this
# row (entry-list order), so the aggregate must precede this bundle in
# dsh.profile.bundles — the standard `dsh plugin add` append order.
# A manual mount row in the profile's own cordis.patch.yml uses the SAME id
# ('dsh-sidebar-vscode'), which fails loudly as a duplicate — keep exactly one
# channel active (see README Installation / 安装方法).
- insert:
    - id: dsh-sidebar-vscode
      name: 'dsh-sidebar-vscode'
      # disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-sidebar-vscode' && e.options.id !== 'dsh-sidebar-vscode' && !e.disabled)"
