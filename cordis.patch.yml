# dsh-sidebar-vscode bundle layer (npm: dsh-sidebar-vscode;
# source: github.com/chendefine/dsh-sidebar-vscode).
#
# Inserts this plugin's host row. The node half owns the vscode-selection
# context boundary (agent/pre-step expansion of canonical `dsh-vscode:`
# and `dsh-vscode-res:` mentions into <text-selection> / <file-selection> /
# <folder-selection> context messages, sourced { kind: 'vscode-mention' } /
# { kind: 'vscode-resource' }) and the same-origin /sidebar/vscode reverse
# proxy; the browser half registers the official right-Sidebar 'vscode' tab
# type (ctx.sidebarRightTabs + the sidebar.right.pane.tab seat), the
# composer reference chips, the reference rail, the Plugins-page
# configuration form (plugins.bundle.config / plugins.row.config), and the
# openResource / openSettingsDocument takeovers.
#
# User-facing configuration (the editor base URL, the workspace path
# mapping, the openAsDefault switch, the open blocklist, the capture caps)
# lives in the plugin's Config schema (src/config.ts — every field
# volatile): the settings service derives the 'dsh-sidebar-vscode' section
# from THIS entry by its id, editable live at
# 设置 → 插件 → dsh-sidebar-vscode 的配置区 / 该行的配置页 (NOT a
# hand-registered settings namespace anymore). The config below is the
# section's shipped base layer — what every unset field resolves to and
# what「恢复默认」reverts to.
#
# Double-mount guard (same pattern as the official bundle patches): an
# aggregate bundle may already mount this package under its own entry id.
# The `!!js` back-off row below is intentionally left COMMENTED OUT (this
# repo ships without it enabled), so in the aggregate scenario the duplicate
# id fails loudly as a duplicate instead of silently backing off — keep
# exactly one channel active (see README Installation / 安装方法);
# uncomment the row only on a loader setup known to evaluate `!!js` rows.
# A manual mount row in the profile's own cordis.patch.yml uses the SAME id
# ('dsh-sidebar-vscode'), which also fails loudly as a duplicate.
- insert:
    - id: dsh-sidebar-vscode
      name: 'dsh-sidebar-vscode'
      # disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-sidebar-vscode' && e.options.id !== 'dsh-sidebar-vscode' && !e.disabled)"
      config:
        openAsDefault: false
        openBlocklist:
          - pdf
          - docx
          - xlsx
          - pptx
          - png
          - jpeg
          - jpg
        serverUrl: ''
        pathMap: ''
        maxLines: 200
        maxBytes: 20000
